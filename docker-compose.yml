version: '3.8'

services:
  # Development service
  car-inspector-dashboard-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8000
    profiles:
      - dev

  # Production service
  car-inspector-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: production
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - prod

networks:
  default:
    name: car-inspector-network